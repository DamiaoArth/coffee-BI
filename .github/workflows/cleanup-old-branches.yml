name: Remove obsolete Coffee BI branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the five reviewed obsolete references
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            if (context.ref !== 'refs/heads/main') throw new Error('Main required');
            const targets = {
              'codespace-vigilant-potato-69vpjr5w7v6c54vq': '35beeb2bdadfc854111f6b9d11fe129806056619',
              'feat/coffee-bi-spa-redesign': '931259b5c3f73d9b85d836098fb85af905baf863',
              'feat/interactive-dashboard-charts': '4f27760359de4e5089ca570bddae6332754ed374',
              'feat/ui-redesign-firestore-seed': '61905284eb528352c3d754f8f2d2b766100f2034',
              'fix/product-crud-persistence': 'cd375422ab6f578573e890577986b99f47dc65e2',
            };
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: '3c023d8c85266279849656afad66998be232b798...' + main.data.object.sha
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('The published local-dev version must be on main first');
            }
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            const reviewed = [];
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              if (targets[branch.name] !== branch.commit.sha) {
                throw new Error('Unreviewed or changed branch: ' + branch.name);
              }
              reviewed.push(branch.name);
            }
            for (const name of reviewed) {
              // Recheck immediately before deletion in case another user pushed.
              const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + name});
              if (ref.data.object.sha !== targets[name]) throw new Error('Branch changed: ' + name);
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + name});
              core.info('Deleted ' + name);
            }
            const remaining = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            if (remaining.length !== 1 || remaining[0].name !== 'main') {
              throw new Error('Cleanup verification failed');
            }
            await core.summary.addHeading('Coffee BI branch cleanup').addList(reviewed).addRaw('Verified: only main remains.').write();
